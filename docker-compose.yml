version: '3.9'

services:

  fastapi:
    build: .
    container_name: agent-architect-api
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  streamlit:
    build: .
    container_name: agent-architect-ui
    command: >
      streamlit run frontend/app.py
      --server.port 8501
      --server.enableCORS false
      --server.enableXsrfProtection false
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://fastapi:8000
    depends_on:
      - fastapi
    restart: unless-stopped
